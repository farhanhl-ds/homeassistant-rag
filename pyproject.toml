[project]
name = "homeassistant-rag"
version = "0.1.0"
description = "RAG chatbot for Home Assistant, Zigbee2MQTT, and ESPHome docs — LLM Zoomcamp 2026 capstone"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.12.3",
    "dlt==1.1.0",
    "fastapi==0.115.0",
    "fastembed==0.4.2",
    "groq==0.11.0",
    "httpx==0.27.2",
    "markdownify==0.13.1",
    "onnxruntime==1.19.2",
    "openai==1.47.0",
    "pandas==2.2.2",
    "pgvector==0.3.4",
    "psycopg[binary]==3.2.1",
    "python-dotenv==1.0.1",
    "pyyaml>=6.0.3",
    "requests==2.32.3",
    "scikit-learn==1.5.1",
    "sqlalchemy==2.0.34",
    "streamlit==1.38.0",
    "tiktoken==0.7.0",
    "tqdm==4.66.5",
    "uvicorn[standard]==0.30.6",
]

[dependency-groups]
dev = [
    "ipykernel==6.29.5",
]
